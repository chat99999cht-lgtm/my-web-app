<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Assessment & Admin Portal</title>

    <!-- Firebase SDK Scripts (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      // Aapki Firebase Configuration Keys Connected
      const firebaseConfig = {
        apiKey: "AIzaSyC4YewvYRyvrpq42TzlPHnyzhMicdRz7RY",
        authDomain: "testing-dd63a.firebaseapp.com",
        databaseURL: "https://testing-dd63a-default-rtdb.firebaseio.com",
        projectId: "testing-dd63a",
        storageBucket: "testing-dd63a.firebasestorage.app",
        messagingSenderId: "901622441214",
        appId: "1:901622441214:web:2a4f14f6b9c4b4ddf471af"
      };

      // Firebase Initialization
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const database = firebase.database();
    </script>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px;">

    <h2>Candidate System & Live Activity Tracker</h2>

    <!-- Candidate Registration Section -->
    <div id="onboardSection" style="background: #1e293b; padding: 15px; border-radius: 8px; max-width: 400px; margin-bottom: 20px;">
        <h3>Candidate Registration</h3>
        <input type="text" id="userNameInput" placeholder="Full Name" style="width: 90%; padding: 8px; margin-bottom: 10px;"><br>
        <input type="text" id="userPhoneInput" placeholder="Mobile Number" style="width: 90%; padding: 8px; margin-bottom: 10px;"><br>
        <input type="password" id="userPinInput" placeholder="4-Digit PIN" maxlength="4" style="width: 90%; padding: 8px; margin-bottom: 10px;"><br>
        <button onclick="submitOnboarding()" style="background: #22c55e; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px;">Start Test</button>
    </div>

    <!-- Typing Test Completion Demo -->
    <div style="background: #1e293b; padding: 15px; border-radius: 8px; max-width: 400px; margin-bottom: 20px;">
        <h3>Typing Test Simulation</h3>
        <button onclick="finishTypingTest(42, 95, 60, 0, '15,000')" style="background: #38bdf8; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px;">Complete Test (Sync Data)</button>
    </div>

    <!-- Master Admin Live Panel -->
    <button onclick="openAdminModal()" style="background: #eab308; color: black; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px;">Open Master Admin View</button>

    <div id="adminModal" style="display:none; background: #1e293b; padding: 20px; border-radius: 8px; margin-top: 20px;">
        <h3 style="color: #38bdf8;">All Candidates Live Activity</h3>
        <div id="adminInterviewLog">Click 'Open Master Admin View' to load...</div>
    </div>

    <!-- Main Logic -->
    <script>
        // Candidate Data Cloud Save Function
        function submitOnboarding() {
            const name = document.getElementById("userNameInput").value;
            const phone = document.getElementById("userPhoneInput").value;
            const pin = document.getElementById("userPinInput").value;

            if(!name || !phone || !pin) {
                alert("Please fill all details!");
                return;
            }

            const userId = "USER_" + phone;
            localStorage.setItem("current_candidate_id", userId);

            // Realtime Sync to Firebase Database
            database.ref('candidates/' + userId).set({
                name: name,
                phone: phone,
                pin: pin,
                registeredAt: new Date().toLocaleString(),
                status: "Registered"
            }).then(() => {
                alert("Candidate Registration Successful!");
            });
        }

        // Typing Performance Sync Function
        function finishTypingTest(wpm, accuracy, totalTimeSeconds, errors, salary) {
            const currentUserId = localStorage.getItem("current_candidate_id");
            
            if(!currentUserId) {
                alert("Please complete Candidate Registration first!");
                return;
            }

            const testResult = {
                wpm: wpm,
                accuracy: accuracy,
                timeTaken: totalTimeSeconds + "s",
                errors: errors,
                assignedSalary: salary,
                completedAt: new Date().toLocaleString(),
                status: errors === 0 ? "PASSED" : "FAILED"
            };

            database.ref('candidates/' + currentUserId + '/typingTest').set(testResult).then(() => {
                alert("Test Results Synced to Admin Panel!");
            });
        }

        // Admin Dashboard Live Fetcher
        function openAdminModal() {
            const logContainer = document.getElementById("adminInterviewLog");
            logContainer.innerHTML = "<p style='color:#38bdf8;'>Loading all candidate records from Cloud...</p>";

            database.ref('candidates').once('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    logContainer.innerHTML = "<p style='color:#94a3b8;'>No candidate data found.</p>";
                    return;
                }

                let htmlContent = "<table style='width:100%; text-align:left; border-collapse:collapse; color:#f8fafc;'>";
                htmlContent += "<tr style='color:#38bdf8; border-bottom:1px solid #334155;'><th style='padding:8px;'>Name</th><th>Phone</th><th>PIN</th><th>Speed</th><th>Accuracy</th><th>Salary Status</th></tr>";

                for (let id in data) {
                    let user = data[id];
                    let test = user.typingTest || {};
                    
                    htmlContent += `
                        <tr style="border-bottom:1px solid #334155;">
                            <td style="padding:8px;">${user.name || '-'}</td>
                            <td>${user.phone || '-'}</td>
                            <td>${user.pin || '-'}</td>
                            <td style="color:#22c55e;">${test.wpm ? test.wpm + ' WPM' : 'Pending'}</td>
                            <td style="color:#38bdf8;">${test.accuracy ? test.accuracy + '%' : 'Pending'}</td>
                            <td style="color:#eab308;">₹${test.assignedSalary || '15,000'}</td>
                        </tr>
                    `;
                }
                htmlContent += "</table>";
                logContainer.innerHTML = htmlContent;
                document.getElementById("adminModal").style.display = "block";
            });
        }
    </script>
</body>
</html>
